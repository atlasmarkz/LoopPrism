name: Publish npm package

# Push a tag like `npm-v0.1.0` (matching npm/package.json) to publish.
#
# Publishes with npm Trusted Publishing (OIDC): no token is stored anywhere. On npmjs.com the
# package `loopprism` lists this repository (atlasmarkz/LoopPrism) and this workflow file
# (publish-npm.yml) as its trusted publisher; npm then accepts the short-lived identity GitHub
# issues to this job (id-token: write) and attaches a provenance statement by itself.
# Needs npm 11.5.1+ and a GitHub-hosted runner.
on:
  push:
    tags: ['npm-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with Trusted Publishing support
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Tag matches package version
        run: test "npm-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
      # The dashboard for `lpa ui`: the build committed for pip users, checked against dashboard/src in CI.
      - name: Bundle the dashboard
        run: rm -rf dashboard && cp -R ../src/loopprism/dashboard/dist dashboard && test -f dashboard/index.html
      - run: npm publish --access public
